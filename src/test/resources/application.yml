spring:
  datasource:
    url: jdbc:h2:mem:lendingdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: false
  docker:
    compose:
      enabled: false

external:
  credit-bureau:
    enabled: false
  notifications:
    enabled: false
