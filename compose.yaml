services:

  postgres:
    image: 'postgres:16'
    environment:
      POSTGRES_DB: lendingdb
      POSTGRES_USER: lending
      POSTGRES_PASSWORD: lending
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lending -d lendingdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  wiremock:
    image: 'wiremock/wiremock:3.9.2'
    ports:
      - '8089:8080'
    volumes:
      - './wiremock:/home/wiremock'
    command: '--global-response-templating --verbose'

volumes:
  postgres_data:
